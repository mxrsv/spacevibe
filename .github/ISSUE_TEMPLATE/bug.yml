name: Bug
description: SpaceVibe showed something wrong, failed, or changed something it should not have.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove real skill, project and path names you prefer not to share. If the app wrote outside
        its own area, ran something or showed a secret, [report it privately](https://github.com/mxrsv/spacevibe/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead. A screenshot helps.
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: Where?
      options:
        - Agents (Skills, Subagents, Hooks, Rules)
        - Activity
        - Limits
        - Session widget
        - Settings or updates
        - Building from source
        - Something else
    validations:
      required: true
  - type: dropdown
    id: cli
    attributes:
      label: Which CLI is involved?
      options:
        - Claude Code
        - Codex
        - Both
        - Neither
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SpaceVibe version or commit
      description: From the About panel, or the commit you built from.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.5
    validations:
      required: true
